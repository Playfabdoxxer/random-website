<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Code Playground</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.3);
            --html-color: #e34c26;
            --css-color: #2965f1;
            --js-color: #f7df1e;
            --csharp-color: #9b4f96;
            --cpp-color: #659ad2;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d2991d;
            --radius: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === HEADER === */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            animation: slideDown 0.5s ease-out;
            flex-shrink: 0;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #e34c26, #58a6ff, #9b4f96, #659ad2);
            background-size: 300% 300%;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            animation: logoGradient 4s ease infinite, logoPulse 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: rotate(45deg);
            animation: shimmer 2.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes logoGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 12px var(--accent-glow); }
            50% { box-shadow: 0 0 28px rgba(255,255,255,0.25); }
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e6edf3, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 8px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            border-color: var(--accent);
            background: #1c2533;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(88, 166, 255, 0.2);
        }
        .btn:active {
            transform: scale(0.95);
            transition: 0.08s;
        }
        .btn-run {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            font-weight: 700;
        }
        .btn-run:hover {
            background: #4ade80;
            border-color: #4ade80;
            box-shadow: 0 4px 18px rgba(63, 185, 80, 0.4);
        }
        .btn-clear {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-clear:hover {
            background: rgba(248, 81, 73, 0.1);
            box-shadow: 0 4px 14px rgba(248, 81, 73, 0.2);
        }
        .btn-copy {
            border-color: var(--warning);
            color: var(--warning);
        }
        .btn-copy:hover {
            background: rgba(210, 153, 29, 0.1);
            box-shadow: 0 4px 14px rgba(210, 153, 29, 0.2);
        }

        /* === MAIN LAYOUT === */
        .main-container {
            display: flex;
            flex: 1;
            min-height: 0;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* === LEFT SIDE: TABBED EDITOR === */
        .editor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            min-width: 0;
        }

        /* === TABS === */
        .tab-bar {
            display: flex;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }

        .tab {
            padding: 11px 18px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            position: relative;
            flex-shrink: 0;
        }
        .tab:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
        }
        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
            background: rgba(88, 166, 255, 0.06);
        }

        .tab-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .tab-dot.html { background: var(--html-color); }
        .tab-dot.css { background: var(--css-color); }
        .tab-dot.js { background: var(--js-color); }
        .tab-dot.csharp { background: var(--csharp-color); }
        .tab-dot.cpp { background: var(--cpp-color); }

        .tab.active .tab-dot {
            box-shadow: 0 0 10px currentColor;
            animation: dotPulse 1.8s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.5; }
        }

        /* === TAB PANELS === */
        .tab-panels {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-panel {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(8px);
        }
        .tab-panel.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .panel-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .panel-header-bar .lang-label {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .panel-header-bar .file-ext {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 0.7rem;
            letter-spacing: 0;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            resize: none;
            outline: none;
            tab-size: 2;
            transition: var(--transition);
        }
        textarea:focus {
            box-shadow: inset 0 0 0 1px var(--accent);
            background: #0c1118;
        }
        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.35;
            font-style: italic;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 38px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.72rem;
            padding: 16px 6px;
            text-align: right;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            overflow: hidden;
            line-height: 1.7;
        }
        .editor-wrapper:hover .line-numbers,
        textarea:focus ~ .line-numbers {
            opacity: 0.55;
        }

        /* === RIGHT SIDE: OUTPUT / PREVIEW === */
        .output-side {
            flex: 0.85;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            min-width: 300px;
        }

        .output-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .output-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
            animation: dotPulse 1.8s ease-in-out infinite;
        }

        .output-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .preview-frame.hidden {
            display: none;
        }

        .output-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 14px;
            pointer-events: none;
        }
        .output-placeholder.hidden {
            display: none;
        }
        .output-placeholder .icon {
            font-size: 3.5rem;
            opacity: 0.25;
            animation: floatUp 4s ease-in-out infinite;
        }
        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .output-placeholder .hint {
            font-size: 0.85rem;
            opacity: 0.55;
            text-align: center;
            line-height: 1.6;
        }
        .output-placeholder .shortcut {
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.78rem;
            border: 1px solid var(--border);
        }

        /* Code output display (for C# / C++) */
        .code-output-display {
            position: absolute;
            inset: 0;
            background: var(--bg-primary);
            padding: 20px;
            overflow: auto;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }
        .code-output-display.visible {
            display: block;
        }
        .code-output-display .comment { color: #6a9955; }
        .code-output-display .keyword { color: #569cd6; }
        .code-output-display .string { color: #ce9178; }
        .code-output-display .type { color: #4ec9b0; }
        .code-output-display .method { color: #dcdcaa; }
        .code-output-display .number { color: #b5cea8; }

        /* === TOAST === */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transform: translateY(18px);
            pointer-events: none;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.info { border-color: var(--accent); color: var(--accent); }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .editor-side {
                flex: 1;
                min-height: 45vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .output-side {
                flex: 1;
                min-height: 30vh;
                min-width: auto;
            }
            .header {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .logo-text { font-size: 1rem; }
            .btn { padding: 6px 10px; font-size: 0.75rem; }
            .tab { padding: 9px 12px; font-size: 0.72rem; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">&lt;/&gt;</div>
            <span class="logo-text">Hybrid Playground</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-copy" onclick="copyCurrentCode()" title="Copy current tab code">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                Copy
            </button>
            <button class="btn" onclick="formatCurrentCode()" title="Format Code">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 8 16 13"/><polyline points="8 3 3 8 8 13"/><line x1="12" y1="20" x2="12" y2="10"/></svg>
                Format
            </button>
            <button class="btn btn-clear" onclick="clearCurrentTab()" title="Clear current tab">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                Clear
            </button>
            <button class="btn btn-run" onclick="executeCode()" title="Run (Ctrl+Enter)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Run
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <!-- LEFT: TABBED EDITOR -->
        <div class="editor-side">
            <div class="tab-bar" id="tabBar">
                <div class="tab active" data-tab="html" onclick="switchTab('html')">
                    <span class="tab-dot html"></span> HTML
                </div>
                <div class="tab" data-tab="css" onclick="switchTab('css')">
                    <span class="tab-dot css"></span> CSS
                </div>
                <div class="tab" data-tab="js" onclick="switchTab('js')">
                    <span class="tab-dot js"></span> JavaScript
                </div>
                <div class="tab" data-tab="csharp" onclick="switchTab('csharp')">
                    <span class="tab-dot csharp"></span> C#
                </div>
                <div class="tab" data-tab="cpp" onclick="switchTab('cpp')">
                    <span class="tab-dot cpp"></span> C++
                </div>
            </div>
            <div class="tab-panels">
                <!-- HTML Panel -->
                <div class="tab-panel active" id="panel-html">
                    <div class="panel-header-bar">
                        <span class="lang-label"><span class="tab-dot html"></span> HTML</span>
                        <span class="file-ext">index.html</span>
                    </div>
                    <div class="editor-wrapper">
                        <textarea id="htmlCode" placeholder="&lt;!-- Write your HTML here --&gt;" spellcheck="false"></textarea>
                        <div class="line-numbers" id="htmlLineNums"></div>
                    </div>
                </div>
                <!-- CSS Panel -->
                <div class="tab-panel" id="panel-css">
                    <div class="panel-header-bar">
                        <span class="lang-label"><span class="tab-dot css"></span> CSS</span>
                        <span class="file-ext">styles.css</span>
                    </div>
                    <div class="editor-wrapper">
                        <textarea id="cssCode" placeholder="/* Write your CSS here */" spellcheck="false"></textarea>
                        <div class="line-numbers" id="cssLineNums"></div>
                    </div>
                </div>
                <!-- JS Panel -->
                <div class="tab-panel" id="panel-js">
                    <div class="panel-header-bar">
                        <span class="lang-label"><span class="tab-dot js"></span> JavaScript</span>
                        <span class="file-ext">script.js</span>
                    </div>
                    <div class="editor-wrapper">
                        <textarea id="jsCode" placeholder="// Write your JavaScript here" spellcheck="false"></textarea>
                        <div class="line-numbers" id="jsLineNums"></div>
                    </div>
                </div>
                <!-- C# Panel -->
                <div class="tab-panel" id="panel-csharp">
                    <div class="panel-header-bar">
                        <span class="lang-label"><span class="tab-dot csharp"></span> C#</span>
                        <span class="file-ext">Program.cs</span>
                    </div>
                    <div class="editor-wrapper">
                        <textarea id="csharpCode" placeholder="// Write your C# code here&#10;using System;&#10;&#10;class Program {&#10;    static void Main() {&#10;        Console.WriteLine(&quot;Hello from C#!&quot;);&#10;    }&#10;}" spellcheck="false"></textarea>
                        <div class="line-numbers" id="csharpLineNums"></div>
                    </div>
                </div>
                <!-- C++ Panel -->
                <div class="tab-panel" id="panel-cpp">
                    <div class="panel-header-bar">
                        <span class="lang-label"><span class="tab-dot cpp"></span> C++</span>
                        <span class="file-ext">main.cpp</span>
                    </div>
                    <div class="editor-wrapper">
                        <textarea id="cppCode" placeholder="// Write your C++ code here&#10;#include &lt;iostream&gt;&#10;using namespace std;&#10;&#10;int main() {&#10;    cout &lt;&lt; &quot;Hello from C++!&quot; &lt;&lt; endl;&#10;    return 0;&#10;}" spellcheck="false"></textarea>
                        <div class="line-numbers" id="cppLineNums"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: OUTPUT / PREVIEW -->
        <div class="output-side">
            <div class="output-header">
                <span class="output-dot"></span>
                <span id="outputLabel">Live Preview</span>
            </div>
            <div class="output-content">
                <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin" title="Live Preview"></iframe>
                <div class="output-placeholder" id="outputPlaceholder">
                    <div class="icon">🚀</div>
                    <div class="hint">Click <strong>Run</strong> or press <span class="shortcut">Ctrl + Enter</span><br>to execute your code</div>
                </div>
                <div class="code-output-display" id="codeOutputDisplay"></div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // === STATE ===
        let currentTab = 'html';
        const webTabs = ['html', 'css', 'js'];
        const compiledTabs = ['csharp', 'cpp'];

        // === DOM REFS ===
        const textareas = {
            html: document.getElementById('htmlCode'),
            css: document.getElementById('cssCode'),
            js: document.getElementById('jsCode'),
            csharp: document.getElementById('csharpCode'),
            cpp: document.getElementById('cppCode')
        };
        const lineNumDivs = {
            html: document.getElementById('htmlLineNums'),
            css: document.getElementById('cssLineNums'),
            js: document.getElementById('jsLineNums'),
            csharp: document.getElementById('csharpLineNums'),
            cpp: document.getElementById('cppLineNums')
        };
        const previewFrame = document.getElementById('previewFrame');
        const outputPlaceholder = document.getElementById('outputPlaceholder');
        const codeOutputDisplay = document.getElementById('codeOutputDisplay');
        const outputLabel = document.getElementById('outputLabel');
        const toast = document.getElementById('toast');

        // === DEFAULT CONTENT ===
        const defaults = {
            html: `<div class="container">
  <div class="card">
    <h1>✨ Hybrid Playground</h1>
    <p class="subtitle">HTML • CSS • JS • C# • C++ — All in one place.</p>
    <div class="counter">
      <button onclick="decrement()" class="btn-demo">−</button>
      <span id="count" class="count-display">0</span>
      <button onclick="increment()" class="btn-demo">+</button>
    </div>
    <p class="hint">You clicked <strong id="clickCount">0</strong> times</p>
  </div>
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
</div>`,
            css: `*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e6edf3;
  overflow: hidden;
}

.container { perspective: 1000px; }

.card {
  background: rgba(22, 27, 34, 0.8);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 48px 40px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  animation: cardEntry 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  z-index: 10;
}

@keyframes cardEntry {
  from { opacity: 0; transform: translateY(40px) rotateX(10deg); }
  to { opacity: 1; transform: translateY(0) rotateX(0); }
}

h1 {

            const code = textareas[tabName].value;
            const escaped = escapeHTML(code);
            // Basic keyword highlighting
            const keywords = tabName === 'csharp'
                ? ['using','class','static','void','int','string','var','new','public','private','protected','internal',
                   'foreach','in','yield','return','if','else','for','while','async','await','IEnumerable','List',

                : ['include','iostream','vector','algorithm','numeric','using','namespace','std','cout','cin','endl',
                   'int','double','float','char','bool','void','auto','const','template','typename','class','struct',
                   'public','private','protected','return','if','else','for','while','do','switch','case','break',
                   'continue','sizeof','typedef','static','virtual','override','new','delete','nullptr','true','false',
                   'sort','max_element','accumulate','for_each','begin','end','push_back','size','main'];

            let highlighted = escaped;
            keywords.forEach(kw => {
                const regex = new RegExp(`\\b(${kw})\\b`, 'g');
                highlighted = highlighted.replace(regex, '<span class="keyword">$1</span>');
            });
            // String highlighting
            highlighted = highlighted.replace(/(&quot;.*?&quot;)/g, '<span class="string">$1</span>');
            highlighted = highlighted.replace(/(&#39;.*?&#39;)/g, '<span class="string">$1</span>');
            // Comments
            highlighted = highlighted.replace(/(\/\/.*)/g, '<span class="comment">$1</span>');
            // Numbers
            highlighted = highlighted.replace(/\b(\d+\.?\d*)\b/g, '<span class="number">$1</span>');

            codeOutputDisplay.innerHTML = highlighted;
        }
