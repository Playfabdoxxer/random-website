<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Hybrid Forums · Gorilla Tag Copies & Mods</title>
    <style>
        /* ---------- RESET & ROOT ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #0b0e17;
            --bg-card: #131a27;
            --bg-input: #1a2333;
            --border-neon: #2affb0;
            --border-dim: rgba(42, 255, 176, 0.15);
            --text-main: #eef5ff;
            --text-dim: #8899cc;
            --neon-green: #2affb0;
            --neon-orange: #ff8c42;
            --neon-pink: #ff3d9a;
            --font-mono: 'Courier New', 'Fira Code', monospace;
            --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --radius: 14px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- MAIN CONTAINER ---------- */
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(11, 14, 23, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            padding: 20px 24px 30px;
            box-shadow: var(--shadow);
        }

        /* ---------- HEADER ---------- */
        .header {
            border-bottom: 2px solid var(--border-dim);
            padding-bottom: 16px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
        }

        .header h1 {
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(42, 255, 176, 0.08);
        }

        .header .sub {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .header .sub span {
            color: var(--neon-green);
            -webkit-text-fill-color: var(--neon-green);
        }

        /* ---------- CATEGORIES (quick filter) ---------- */
        .categories-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 14px;
            padding: 12px 0 18px;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 24px;
        }

        .categories-bar .cat-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            align-self: center;
        }

        .cat-btn {
            background: transparent;
            border: 1px solid var(--border-dim);
            border-radius: 40px;
            padding: 4px 16px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.25s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cat-btn:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 20px rgba(42, 255, 176, 0.02);
        }

        .cat-btn.active {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(42, 255, 176, 0.04);
        }

        /* ---------- FORM ---------- */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            padding: 20px 22px 24px;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
            transition: 0.25s;
        }

        .form-card:focus-within {
            border-color: var(--neon-green);
            box-shadow: 0 0 40px rgba(42, 255, 176, 0.02);
        }

        .form-card h2 {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--neon-green);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-dim);
            border-radius: 10px;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            transition: 0.25s;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 30px rgba(42, 255, 176, 0.02);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-group select option {
            background: var(--bg-card);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--neon-green), var(--neon-orange));
            border: none;
            border-radius: 60px;
            padding: 10px 32px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0b0e17;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(42, 255, 176, 0.05);
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(42, 255, 176, 0.12);
        }

        /* ---------- POSTS FEED ---------- */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0 14px;
            border-bottom: 1px solid var(--border-dim);
            padding-bottom: 8px;
        }

        .feed-header h2 {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--neon-orange);
            letter-spacing: 0.5px;
        }

        .feed-header .count {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 6px;
        }

        /* ---------- POST CARD ---------- */
        .post {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            padding: 18px 20px 20px;
            transition: 0.25s;
            box-shadow: var(--shadow);
            animation: fadeUp 0.3s ease;
        }

        .post:hover {
            border-color: rgba(42, 255, 176, 0.12);
        }

        .post-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px 14px;
            margin-bottom: 6px;
        }

        .post-title {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
        }

        .post-category {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 2px 12px;
            border-radius: 40px;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            background: rgba(42, 255, 176, 0.02);
            white-space: nowrap;
        }

        .post-category.apk {
            border-color: var(--neon-orange);
            color: var(--neon-orange);
        }
        .post-category.tutorial {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .post-category.showcase {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }
        .post-category.support {
            border-color: #ffb74d;
            color: #ffb74d;
        }

        .post-content {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin: 8px 0 10px;
            word-break: break-word;
            line-height: 1.7;
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border-dim);
            padding-top: 10px;
            margin-top: 4px;
        }

        .post-footer .timestamp {
            opacity: 0.7;
        }

        .post-footer .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 61, 154, 0.2);
            border-radius: 40px;
            padding: 2px 14px;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--neon-pink);
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .post-footer .delete-btn:hover {
            background: rgba(255, 61, 154, 0.04);
            border-color: var(--neon-pink);
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            border: 1px dashed var(--border-dim);
            border-radius: var(--radius);
        }

        .empty-state .big {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 6px;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            margin-top: 32px;
            padding-top: 18px;
            border-top: 1px solid var(--border-dim);
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .footer .heart {
            color: var(--neon-pink);
        }
        .footer .highlight {
            color: var(--neon-green);
        }

        /* ---------- ANIMATIONS ---------- */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .container {
                padding: 14px 14px 20px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .header .sub {
                font-size: 0.65rem;
            }
            .form-card {
                padding: 16px;
            }
            .post {
                padding: 14px 16px;
            }
            .post-title {
                font-size: 1rem;
            }
            .categories-bar {
                gap: 6px 10px;
            }
            .cat-btn {
                font-size: 0.6rem;
                padding: 2px 12px;
            }
            .btn-submit {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }

        @media (max-width: 400px) {
            .post-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .post-category {
                font-size: 0.5rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ========== HEADER ========== -->
        <header class="header">
            <div>
                <h1>// HYBRID FORUMS</h1>
                <div class="sub"><span>⏣</span> gorilla tag copies · mods · apk</div>
            </div>
            <div class="sub" style="font-size:0.7rem;">
                <span id="postCount">0</span> threads
            </div>
        </header>

        <!-- ========== CATEGORY FILTER ========== -->
        <div class="categories-bar">
            <span class="cat-label">⌘ filter</span>
            <button class="cat-btn active" data-cat="all">all</button>
            <button class="cat-btn" data-cat="APK Downloads">apk</button>
            <button class="cat-btn" data-cat="Modding Tutorials">tutorials</button>
            <button class="cat-btn" data-cat="Fangame Showcase">showcase</button>
            <button class="cat-btn" data-cat="Help & Support">support</button>
        </div>

        <!-- ========== POST CREATION FORM ========== -->
        <section class="form-card" id="formCard">
            <h2>✦ new thread</h2>
            <form id="postForm">
                <div class="form-group">
                    <label for="postTitle">title</label>
                    <input type="text" id="postTitle" placeholder="e.g. How to mod Gorilla Tag copies" required />
                </div>
                <div class="form-group">
                    <label for="postCategory">category</label>
                    <select id="postCategory">
                        <option value="APK Downloads">APK Downloads</option>
                        <option value="Modding Tutorials">Modding Tutorials</option>
                        <option value="Fangame Showcase">Fangame Showcase</option>
                        <option value="Help & Support">Help & Support</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="postContent">content</label>
                    <textarea id="postContent" placeholder="Share your mod, APK, or question..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">⏎ post thread</button>
            </form>
        </section>

        <!-- ========== POSTS FEED ========== -->
        <div class="feed-header">
            <h2>📡 feed</h2>
            <span class="count" id="feedCount">0 threads</span>
        </div>

        <div class="post-list" id="postList">
            <!-- posts rendered by JavaScript -->
        </div>

        <!-- ========== FOOTER ========== -->
        <footer class="footer">
            <span class="highlight">⏣</span> hybrid forums · built with <span class="heart">♥</span> for gorilla tag modders<br>
            <span style="opacity:0.5;font-size:0.6rem;">all posts saved locally · no limits</span>
        </footer>

    </div>

    <!-- ================================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ================================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- DOM REFS ----------
            const form = document.getElementById('postForm');
            const titleInput = document.getElementById('postTitle');
            const categorySelect = document.getElementById('postCategory');
            const contentInput = document.getElementById('postContent');
            const postList = document.getElementById('postList');
            const feedCount = document.getElementById('feedCount');
            const postCountSpan = document.getElementById('postCount');

            const catButtons = document.querySelectorAll('.cat-btn');
            let activeCategory = 'all';

            // ---------- STORAGE KEY ----------
            const STORAGE_KEY = 'hybrid_forum_posts';

            // ---------- LOAD POSTS FROM localStorage ----------
            function loadPosts() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (_) {
                    return [];
                }
            }

            // ---------- SAVE POSTS TO localStorage ----------
            function savePosts(posts) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
            }

            // ---------- RENDER POSTS ----------
            function renderPosts(category = 'all') {
                const allPosts = loadPosts();

                // filter
                const filtered = category === 'all' ?
                    allPosts :
                    allPosts.filter(p => p.category === category);

                // update counts
                feedCount.textContent = `${filtered.length} thread${filtered.length !== 1 ? 's' : ''}`;
                postCountSpan.textContent = allPosts.length;

                if (filtered.length === 0) {
                    postList.innerHTML = `
                            <div class="empty-state">
                                <span class="big">🔍</span>
                                no threads yet — be the first to post!
                            </div>
                        `;
                    return;
                }

                // sort newest first (by timestamp)
                const sorted = [...filtered].sort((a, b) => b.timestamp - a.timestamp);

                let html = '';
                sorted.forEach(post => {
                    const date = new Date(post.timestamp);
                    const timeStr = date.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // category class for styling
                    let catClass = '';
                    const cat = post.category || 'General';
                    if (cat === 'APK Downloads') catClass = 'apk';
                    else if (cat === 'Modding Tutorials') catClass = 'tutorial';
                    else if (cat === 'Fangame Showcase') catClass = 'showcase';
                    else if (cat === 'Help & Support') catClass = 'support';

                    html += `
                            <div class="post" data-id="${post.id}">
                                <div class="post-header">
                                    <span class="post-title">${escapeHtml(post.title)}</span>
                                    <span class="post-category ${catClass}">${escapeHtml(cat)}</span>
                                </div>
                                <div class="post-content">${escapeHtml(post.content)}</div>
                                <div class="post-footer">
                                    <span class="timestamp">⏱ ${timeStr}</span>
                                    <button class="delete-btn" data-id="${post.id}">✕ delete</button>
                                </div>
                            </div>
                        `;
                });

                postList.innerHTML = html;

                // attach delete events
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id, 10);
                        deletePost(id);
                    });
                });
            }

            // ---------- SIMPLE ESCAPE (prevent XSS) ----------
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- ADD NEW POST ----------
            function addPost(title, category, content) {
                const posts = loadPosts();
                const newPost = {
                    id: Date.now() + Math.floor(Math.random() * 1000),
                    title: title.trim(),
                    category: category.trim(),
                    content: content.trim(),
                    timestamp: Date.now()
                };
                posts.push(newPost);
                savePosts(posts);

                // if we're currently filtering, re-render with the active filter
                renderPosts(activeCategory);
            }

            // ---------- DELETE POST ----------
            function deletePost(id) {
                let posts = loadPosts();
                posts = posts.filter(p => p.id !== id);
                savePosts(posts);
                renderPosts(activeCategory);
            }

            // ---------- FORM SUBMISSION ----------
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const title = titleInput.value.trim();
                const category = categorySelect.value;
                const content = contentInput.value.trim();

                if (!title || !content) {
                    alert('Please fill in both title and content.');
                    return;
                }

                addPost(title, category, content);

                // reset form
                titleInput.value = '';
                contentInput.value = '';
                titleInput.focus();

                // scroll to feed
                document.querySelector('.feed-header').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            // ---------- CATEGORY FILTER BUTTONS ----------
            catButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    catButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeCategory = this.dataset.cat;
                    renderPosts(activeCategory);
                });
            });

            // ---------- KEYBOARD SHORTCUT: Ctrl+Enter to submit ----------
            contentInput.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });

            // ---------- INITIAL RENDER ----------
            renderPosts('all');

            // ---------- CONSOLE EASTER EGG ----------
            console.log('%c// HYBRID FORUMS', 'font-size:2rem;font-weight:bold;color:#2affb0;');
            console.log('%cgorilla tag copies · mods · apk — built by Bread', 'font-size:1rem;color:#ff8c42;');

        })();
    </script>

</body>
</html>
