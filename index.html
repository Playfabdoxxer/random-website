<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Code Playground</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.3);
            --html-color: #e34c26;
            --css-color: #563d7c;
            --js-color: #f7df1e;
            --success: #3fb950;
            --danger: #f85149;
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* === HEADER === */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--html-color), var(--accent), var(--css-color));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            animation: logoPulse 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 15px var(--accent-glow); }
            50% { box-shadow: 0 0 30px rgba(255,255,255,0.2); }
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e6edf3, #58a6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 9px 18px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            border-color: var(--accent);
            background: #1c2533;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(88, 166, 255, 0.2);
        }

        .btn:active {
            transform: scale(0.96);
            transition: 0.1s;
        }

        .btn-run {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            font-weight: 700;
        }

        .btn-run:hover {
            background: #4ade80;
            border-color: #4ade80;
            box-shadow: 0 4px 20px rgba(63, 185, 80, 0.4);
        }

        .btn-clear {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-clear:hover {
            background: rgba(248, 81, 73, 0.1);
            box-shadow: 0 4px 15px rgba(248, 81, 73, 0.2);
        }

        /* === MAIN LAYOUT === */
        .main-container {
            display: flex;
            flex: 1;
            gap: 2px;
            background: var(--border);
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .panel {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            transition: var(--transition);
        }

        .panel.resizable {
            resize: horizontal;
            overflow: auto;
            min-width: 250px;
            max-width: 50%;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .panel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: dotPulse 2s ease-in-out infinite;
        }

        .panel-dot.html { background: var(--html-color); animation-delay: 0s; }
        .panel-dot.css { background: var(--css-color); animation-delay: 0.3s; }
        .panel-dot.js { background: var(--js-color); animation-delay: 0.6s; }
        .panel-dot.preview { background: var(--accent); animation-delay: 0.9s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            resize: none;
            outline: none;
            tab-size: 2;
            transition: var(--transition);
        }

        textarea:focus {
            box-shadow: inset 0 0 0 1px var(--accent);
            background: #0c1118;
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.4;
            font-style: italic;
        }

        .line-numbers {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.75rem;
            padding: 16px 8px;
            text-align: right;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            overflow: hidden;
            line-height: 1.7;
        }

        .editor-wrapper:hover .line-numbers,
        textarea:focus ~ .line-numbers {
            opacity: 0.6;
        }

        /* Preview Panel */
        .preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
            transition: var(--transition);
        }

        .preview-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            gap: 16px;
            animation: floatUp 4s ease-in-out infinite;
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .preview-placeholder .icon {
            font-size: 4rem;
            opacity: 0.3;
        }

        .preview-placeholder .hint {
            font-size: 0.9rem;
            opacity: 0.6;
            text-align: center;
            line-height: 1.6;
        }

        .preview-placeholder .shortcut {
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }

        /* === TOAST === */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        /* === RESIZE HANDLE === */
        .resize-handle {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .resize-handle:hover,
        .resize-handle.active {
            background: var(--accent);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .panel.resizable {
                resize: none;
                min-width: auto;
                max-width: 100%;
                min-height: 150px;
                max-height: 40vh;
            }
            .header {
                padding: 10px 14px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo-text {
                font-size: 1.1rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">&lt;/&gt;</div>
            <span class="logo-text">Hybrid Playground</span>
        </div>
        <div class="header-actions">
            <button class="btn" onclick="formatCode()" title="Format Code">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 8 16 13"/><polyline points="8 3 3 8 8 13"/><line x1="12" y1="20" x2="12" y2="10"/></svg>
                Format
            </button>
            <button class="btn btn-clear" onclick="clearAll()" title="Clear All">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                Clear
            </button>
            <button class="btn btn-run" onclick="runCode()" title="Run (Ctrl+Enter)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Run
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main-container" id="mainContainer">

        <!-- HTML Panel -->
        <div class="panel resizable" id="htmlPanel">
            <div class="panel-header">
                <span class="panel-dot html"></span> HTML
            </div>
            <div class="editor-wrapper">
                <textarea id="htmlCode" placeholder="<!-- Write your HTML here -->" spellcheck="false"></textarea>
                <div class="line-numbers" id="htmlLineNumbers"></div>
            </div>
        </div>

        <!-- CSS Panel -->
        <div class="panel resizable" id="cssPanel">
            <div class="panel-header">
                <span class="panel-dot css"></span> CSS
            </div>
            <div class="editor-wrapper">
                <textarea id="cssCode" placeholder="/* Write your CSS here */" spellcheck="false"></textarea>
                <div class="line-numbers" id="cssLineNumbers"></div>
            </div>
        </div>

        <!-- JS Panel -->
        <div class="panel resizable" id="jsPanel">
            <div class="panel-header">
                <span class="panel-dot js"></span> JavaScript
            </div>
            <div class="editor-wrapper">
                <textarea id="jsCode" placeholder="// Write your JavaScript here" spellcheck="false"></textarea>
                <div class="line-numbers" id="jsLineNumbers"></div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="panel" id="previewPanel" style="flex: 1.2;">
            <div class="panel-header">
                <span class="panel-dot preview"></span> Live Preview
            </div>
            <div class="preview-placeholder" id="previewPlaceholder">
                <div class="icon">🚀</div>
                <div class="hint">Click <strong>Run</strong> or press <span class="shortcut">Ctrl + Enter</span><br>to see your code come alive</div>
            </div>
            <iframe id="previewFrame" class="preview-frame" style="display:none;" sandbox="allow-scripts allow-modals allow-same-origin" title="Live Preview"></iframe>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // === DOM ELEMENTS ===
        const htmlCode = document.getElementById('htmlCode');
        const cssCode = document.getElementById('cssCode');
        const jsCode = document.getElementById('jsCode');
        const previewFrame = document.getElementById('previewFrame');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const toast = document.getElementById('toast');
        const htmlPanel = document.getElementById('htmlPanel');
        const cssPanel = document.getElementById('cssPanel');
        const jsPanel = document.getElementById('jsPanel');

        // === DEFAULT TEMPLATE ===
        const defaultHTML = `<div class="container">
  <div class="card">
    <h1>✨ Hybrid Playground</h1>
    <p class="subtitle">Edit HTML, CSS, and JS — See instant magic.</p>
    <div class="counter">
      <button onclick="decrement()" class="btn-demo">−</button>
      <span id="count" class="count-display">0</span>
      <button onclick="increment()" class="btn-demo">+</button>
    </div>
    <p class="hint">You clicked <strong id="clickCount">0</strong> times</p>
  </div>
  <div class="floating-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
</div>`;

        const defaultCSS = `*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e6edf3;
  overflow: hidden;
}

.container {
  perspective: 1000px;
}

.card {
  background: rgba(22, 27, 34, 0.8);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 48px 40px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  animation: cardEntry 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  z-index: 10;
}

@keyframes cardEntry {
  from {
    opacity: 0;
    transform: translateY(40px) rotateX(10deg);
  }
  to {
    opacity: 1;
    transform: translateY(0) rotateX(0);
  }
}

h1 {
  font-size: 2.4rem;
  font-weight: 800;
  letter-spacing: -1px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #58a6ff, #bc8cff, #ff6b9d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  color: #8b949e;
  font-size: 1rem;
  margin-bottom: 32px;
}

.counter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
}

.btn-demo {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  color: #e6edf3;
  font-size: 1.5rem;
  cursor: pointer;
  transition: all 0.2s ease;
  font-weight: 600;
}

.btn-demo:hover {
  background: rgba(88, 166, 255, 0.2);
  border-color: #58a6ff;
  transform: scale(1.1);
  box-shadow: 0 0 25px rgba(88, 166, 255, 0.3);
}

.btn-demo:active {
  transform: scale(0.9);
}

.count-display {
  font-size: 3rem;
  font-weight: 800;
  min-width: 80px;
  color: #e6edf3;
}

.hint {
  color: #8b949e;
  font-size: 0.9rem;
}

/* Floating shapes */
.floating-shapes {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.shape {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  animation: floatShape 8s ease-in-out infinite;
}

.shape-1 {
  width: 300px;
  height: 300px;
  background: #58a6ff;
  top: 10%;
  left: 5%;
  animation-delay: 0s;
}

.shape-2 {
  width: 250px;
  height: 250px;
  background: #bc8cff;
  bottom: 15%;
  right: 8%;
  animation-delay: -3s;
}

.shape-3 {
  width: 200px;
  height: 200px;
  background: #ff6b9d;
  top: 50%;
  left: 60%;
  animation-delay: -5s;
}

@keyframes floatShape {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
}`;

        const defaultJS = `let count = 0;
let totalClicks = 0;

function updateDisplay() {
  document.getElementById('count').textContent = count;
  document.getElementById('clickCount').textContent = totalClicks;
}

function increment() {
  count++;
  totalClicks++;
  updateDisplay();
  animateButton('+');
}

function decrement() {
  count--;
  totalClicks++;
  updateDisplay();
  animateButton('-');
}

function animateButton(type) {
  const card = document.querySelector('.card');
  card.style.transform = type === '+' ? 'scale(1.02)' : 'scale(0.98)';
  setTimeout(() => {
    card.style.transform = 'scale(1)';
  }, 150);
}

// Initialize
updateDisplay();
console.log('🚀 Hybrid Playground ready!');`;

        // Load defaults
        htmlCode.value = defaultHTML;
        cssCode.value = defaultCSS;
        jsCode.value = defaultJS;

        // === RUN CODE ===
        function runCode() {
            const html = htmlCode.value;
            const css = cssCode.value;
            const js = jsCode.value;

            const fullDocument = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>${css}</style>
</head>
<body>
    ${html}
    <script>
        try {
            ${js}
        } catch (error) {
            document.body.innerHTML += '<div style="position:fixed;bottom:20px;right:20px;background:#f85149;color:#fff;padding:12px 20px;border-radius:8px;font-family:monospace;z-index:99999;font-size:13px;max-width:400px;"><strong>⚠️ JS Error:</strong> ' + error.message + '</div>';
            console.error(error);
        }
    <\/script>
</body>
</html>`;

            const blob = new Blob([fullDocument], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            previewFrame.style.display = 'block';
            previewPlaceholder.style.display = 'none';
            previewFrame.src = url;

            // Clean up old blob URL after load
            previewFrame.onload = () => {
                URL.revokeObjectURL(url);
            };

            showToast('Code executed successfully! 🎉', 'success');
        }

        // === FORMAT CODE ===
        function formatCode() {
            try {
                // Simple HTML formatting
                let html = htmlCode.value;
                html = html.replace(/>\s+</g, '>\n<');
                html = html.replace(/(<[^\/][^>]*>)([^<]+)(<\/)/g, (match, open, text, close) => {
                    if (text.trim()) return open + '\n  ' + text.trim() + '\n' + close;
                    return match;
                });
                htmlCode.value = html;

                showToast('Code formatted! ✨', 'success');
            } catch (e) {
                showToast('Format failed: ' + e.message, 'error');
            }
        }

        // === CLEAR ALL ===
        function clearAll() {
            htmlCode.value = '';
            cssCode.value = '';
            jsCode.value = '';
            previewFrame.style.display = 'none';
            previewPlaceholder.style.display = 'flex';
            previewFrame.src = 'about:blank';
            showToast('All cleared 🧹', 'success');
        }

        // === TOAST ===
        let toastTimer;
        function showToast(message, type) {
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // === KEYBOARD SHORTCUTS ===
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                formatCode();
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'K') {
                e.preventDefault();
                clearAll();
            }
        });

        // === TAB SUPPORT IN TEXTAREAS ===
        document.querySelectorAll('textarea').forEach(textarea => {
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + 2;
                }
            });
        });

        // === LINE NUMBERS UPDATE ===
        function updateLineNumbers(textarea, lineNumbersDiv) {
            const lines = textarea.value.split('\n').length;
            let nums = '';
            for (let i = 1; i <= lines; i++) {
                nums += i + '\n';
            }
            lineNumbersDiv.textContent = nums;
        }

        htmlCode.addEventListener('input', () => updateLineNumbers(htmlCode, document.getElementById('htmlLineNumbers')));
        cssCode.addEventListener('input', () => updateLineNumbers(cssCode, document.getElementById('cssLineNumbers')));
        jsCode.addEventListener('input', () => updateLineNumbers(jsCode, document.getElementById('jsLineNumbers')));

        // Initial line numbers
        updateLineNumbers(htmlCode, document.getElementById('htmlLineNumbers'));
        updateLineNumbers(cssCode, document.getElementById('cssLineNumbers'));
        updateLineNumbers(jsCode, document.getElementById('jsLineNumbers'));

        // === SYNC SCROLL ===
        const allTextareas = [htmlCode, cssCode, jsCode];
        let syncing = false;

        // === PANEL RESIZE WITH DRAG ===
        // (Native CSS resize handles this, but we enhance with keyboard-friendly min-widths)
